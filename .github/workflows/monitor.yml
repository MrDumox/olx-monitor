name: OLX monitor

on:
  schedule:
    # Repo publiczne: co 10 min. Repo prywatne: ustaw "*/30 * * * *",
    # żeby zmieścić się w darmowych 2000 minutach/miesiąc.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olx-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sprawdź OLX
        run: python olx_scraper.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Runner jest jednorazowy, więc listę widzianych ogłoszeń trzymamy w repo.
      # Zapisujemy ją też po błędzie, bo część powiadomień mogła już pójść.
      - name: Zapisz stan
        if: always()
        run: |
          [ -f data/seen.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizacja widzianych ogłoszeń"
          git push || (git pull --rebase && git push)
